<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UWOOGEE</title>
<!-- 진입 화면이 뜰 수 있는 경우, 페이지 내용이 먼저 번쩍 보이지 않게 잠깐 숨김 (진입 화면을 안 쓰면 바로 풀림) -->
<script>
  try {
    if (window.self === window.top && !/^#post-/.test(location.hash))
      document.documentElement.classList.add("intro-pending");
  } catch (e) {}
</script>
<!-- 링크 미리보기 (카카오톡·X·디스코드 등) -->
<meta name="description" content="YU-IL Portfolio">
<meta property="og:type" content="website">
<meta property="og:site_name" content="UWOOGEE">
<meta property="og:title" content="UWOOGEE">
<meta property="og:description" content="YU-IL Portfolio">
<meta property="og:url" content="https://uwoogee.com/">
<meta property="og:image" content="https://uwoogee.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="UWOOGEE">
<meta name="twitter:description" content="YU-IL Portfolio">
<meta name="twitter:image" content="https://uwoogee.com/og-image.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    /* 팝업: 편집기 > 팝업 메뉴에서 변경 */
    --modal-gap: 24px;
    --close-color: #ec8fb0;
    --close-bg: #ffffff;
    --scroll-color: #f3b6cb;
    /* 팝업 안쪽 간격 · 줄 간격 */
    --pop-top: 32px;          /* 팝업 맨 위 ~ 제목 */
    --pop-title-gap: 8px;     /* 제목 ~ 소개 */
    --pop-content-gap: 24px;  /* 소개 ~ 첫 게시글 */
    --pop-block-gap: 16px;    /* 게시글 블록 사이 */
    --pop-bottom: 32px;       /* 마지막 ~ 팝업 맨 아래 */
    --pop-desc-line: 1.7;     /* 소개 문구 행간 */
    --pop-text-line: 1.8;     /* 게시글 글 행간 */
    --bg: #000000;
    --card: #fdfcfd;
    --pink: #ec8fb0;
    --pink-soft: #f3b6cb;
    --text-sub: #e59ab5;
    --shadow: 0 4px 14px rgba(120, 130, 150, .18);
    --radius: 12px;
    /* 글꼴: Pretendard. 요소별 크기·굵기·자간은 아래 TEXT_STYLES + 편집기 > 글꼴 에서 지정 */
    --font: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--pink);
    font-family: var(--font);
    min-height: 100vh;
  }
  body.modal-open { overflow: hidden; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 56px;
    text-align: center;
    position: relative; z-index: 1;   /* 스티커(뒤쪽)보다 위 */
  }
  .hero { position: relative; z-index: 1; }

  /* ---------- 스크롤하면 스티커가 착! 붙음 (편집기 > 스티커) ---------- */
  body { position: relative; }
  .stickers { position: absolute; left: 0; top: 0; width: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
  .stickers.front { z-index: 5; }
  .sticker {
    position: absolute; display: block; height: auto;
    opacity: 0; transform: rotate(var(--r)) scale(1.6);
    image-rendering: auto;
    filter: var(--sticker-shadow, drop-shadow(0 4px 6px rgba(0, 0, 0, .45)));
  }
  .sticker.stuck { animation: sticker-slap .55s cubic-bezier(.2, .9, .3, 1.25) forwards; }
  .sticker.instant { opacity: 1; transform: rotate(var(--r)) scale(1); }
  @keyframes sticker-slap {
    0%   { opacity: 0; transform: rotate(calc(var(--r) + 18deg)) scale(1.7); }
    55%  { opacity: 1; transform: rotate(var(--r)) scale(.9); }
    80%  { transform: rotate(var(--r)) scale(1.04); }
    100% { opacity: 1; transform: rotate(var(--r)) scale(1); }
  }

  /* ---------- Header (GIF · 영상 · 이미지) ---------- */
  .hero { width: 100%; overflow: hidden; background: #000; }
  /* 원본 비율 그대로 전체가 보이도록 (잘리지 않음). 너무 커지지 않게 화면 높이의 70%까지만 */
  .hero img, .hero video {
    display: block; width: 100%; height: auto;
    max-height: 70vh; object-fit: contain;
  }
  .hero:empty { display: none; }

  /* ---------- Profile ---------- */
  .logo {
    font-family: var(--font);
    font-style: italic;
    color: var(--pink);
  }
  .avatar {
    width: 160px; height: 160px;
    margin: 28px auto 18px;
    border-radius: 50%;
    background: #d6e4fb;
    display: grid; place-items: center;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar .ph { font-size: 64px; }
  .name {
  }
  .kana { margin-top: 6px; color: var(--pink-soft); }

  .socials { display: flex; justify-content: center; gap: 22px; margin: 22px 0 18px; }
  .socials a { display: inline-flex; transition: transform .2s, opacity .2s; }
  .socials a:hover { transform: translateY(-2px); opacity: .8; }
  .socials svg { width: 1em; height: 1em; }

  .bio { line-height: 1.7; color: var(--text-sub); white-space: pre-line; }

  /* ---------- Link cards ----------
     표지 이미지를 카드 전체 배경으로 깔고, 왼쪽에 흰색 그라데이션 + 글씨 */
  .links { list-style: none; margin-top: 32px; display: grid; gap: 20px; text-align: left; }

  /* 카테고리 구분선: 이름 + 오른쪽으로 이어지는 가는 선 */
  .category {
    display: flex; align-items: center; gap: 14px;
    margin-top: 18px; padding: 0 2px;
  }
  .category:first-child { margin-top: 0; }
  .category span { white-space: nowrap; }
  .category::after { content: ""; flex: 1; height: 1px; background: currentColor; opacity: .35; }

  .card {
    position: relative;
    height: 108px;
    border-radius: 14px;
    overflow: hidden;
    background: transparent;
    isolation: isolate;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
    container-type: inline-size;
    /* 카드별 호버 색 (편집기에서 지정, 없으면 기본값) */
    --hover-fill: #ec8fb0;
    --hover-text: #ffffff;
  }

  .card-bg {
    position: absolute; inset: 0;
    background: #eee center / cover no-repeat;
  }
  .card-bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg,
      rgba(255, 255, 255, .98) 0%,
      rgba(255, 255, 255, .94) 32%,
      rgba(255, 255, 255, .55) 56%,
      rgba(255, 255, 255, 0) 80%);
  }

  /* 글씨가 놓이는 층 (기본 글씨 층과 색 층이 같은 배치를 씀) */
  .card-layer {
    position: absolute; inset: 0;
    display: flex; align-items: center;
    padding: 0 0 0 clamp(16px, 4.5cqi, 30px);
    pointer-events: none;
  }
  /* 클릭 영역: 카드 전체를 덮는 투명 버튼/링크 */
  .card-link {
    position: absolute; inset: 0; z-index: 2;
    width: 100%; border: 0; padding: 0; background: none; cursor: pointer;
  }
  .card-link:focus-visible { outline: none; }

  /* 호버: 색 판이 왼쪽에서 오른쪽으로 미끄러지듯 덮고, 마우스를 떼면 왼쪽으로 걷힘.
     색 판 안에 같은 글씨(호버 글씨 색)가 들어 있어서, 경계가 지나가는 자리부터 글씨 색이 바뀜 */
  .card-fill {
    z-index: 1;
    /* 반투명 색 (기본 80%, 카드마다 편집기에서 조절) */
    /* 오른쪽 끝은 살짝 흐려지며 사라짐 (시작·끝 지점은 카드마다 편집기에서 조절) */
    --hover-solid: color-mix(in srgb, var(--hover-fill) var(--hover-alpha, 80%), transparent);
    background: linear-gradient(90deg,
      var(--hover-solid) 0%,
      var(--hover-solid) var(--fade-start, 85%),
      transparent var(--fade-end, 100%));
    clip-path: inset(0 100% 0 0);
  }
  /* 기본 글씨는 색 판이 지나간 자리만큼 지워서 반투명 색 아래로 겹쳐 비치지 않게 함 */
  .card-base { clip-path: inset(0 0 0 0); }
  .card-fill, .card-base {
    transition: clip-path .35s cubic-bezier(.4, 0, .2, 1);           /* 걷힐 때 */
    will-change: clip-path;
  }
  .card:hover .card-fill, .card:has(.card-link:focus-visible) .card-fill, .card.demo .card-fill,
  .card:hover .card-base, .card:has(.card-link:focus-visible) .card-base, .card.demo .card-base {
    transition: clip-path .6s cubic-bezier(.22, .8, .3, 1);          /* 덮을 때 */
  }
  .card:hover .card-fill, .card:has(.card-link:focus-visible) .card-fill, .card.demo .card-fill { clip-path: inset(0 0 0 0); }
  .card:hover .card-base, .card:has(.card-link:focus-visible) .card-base, .card.demo .card-base { clip-path: inset(0 0 0 100%); }
  .card-fill .card-title, .card-fill .card-sub { color: var(--hover-text); }
  .card:has(.card-link:focus-visible) { outline: 2px solid #fff; outline-offset: 3px; }
  .card-content {
    position: relative;
    display: flex; align-items: center; gap: clamp(12px, 3.2cqi, 22px);
    min-width: 0; max-width: 74%;
  }
  .card-text { min-width: 0; }
  .card-title, .card-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  .card-sub { margin-top: 6px; }

  /* ---------- Modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    padding: var(--modal-gap) 16px;
    background: rgba(0, 0, 0, .7);
    opacity: 0; visibility: hidden;
    transition: opacity .25s, visibility .25s;
  }
  .modal.open { opacity: 1; visibility: visible; }
  .modal-panel {
    position: relative;
    /* PC 팝업 크기: 편집기 > 팝업 에서 조절 (화면 폭의 최대 94%) */
    width: min(var(--modal-width, 1400px), 94vw);
    max-height: calc(100vh - var(--modal-gap) * 2);
    max-height: calc(100dvh - var(--modal-gap) * 2);
    display: flex; flex-direction: column;
    overflow: hidden;            /* 네 모서리 모두 같은 라운드로 잘라냄 */
    background: var(--card);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(40, 40, 70, .3);
    transform: translateY(16px) scale(.98);
    transition: transform .3s;
  }
  .modal.open .modal-panel { transform: none; }
  .modal-scroll {
    overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin; scrollbar-color: var(--scroll-color) transparent;
  }
  .modal-scroll::-webkit-scrollbar { width: 8px; }
  .modal-scroll::-webkit-scrollbar-track { background: transparent; margin: 18px 0; }
  .modal-scroll::-webkit-scrollbar-thumb { background: var(--scroll-color); border-radius: 99px; border: 2px solid var(--pop-bg, var(--card)); }

  /* ---------- 다크 팝업 (편집기 > 팝업 > 스타일) ----------
     어두운 패널 + 옅은 테두리, 이미지는 테두리 있는 검은 프레임 안, 아래는 꽉 찬 어두운 버튼 */
  .modal.dark .modal-panel {
    background: var(--pop-bg, #141414);
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6);
  }
  .modal.dark .modal-close {
    /* 다크: 배경색을 정하지 않았으면 투명 */
    background: var(--close-bg-custom, transparent); box-shadow: none;
    font-size: var(--close-x, 30px); font-weight: 300; transition: opacity .2s;
  }
  .modal.dark .modal-close:hover { opacity: .65; }
  .modal.dark .post figure {
    background: #000;
    border: 1px solid rgba(255, 255, 255, .07);
    border-radius: 16px;
    padding: var(--pop-frame-pad, 0px);
    overflow: hidden;
  }
  .modal.dark .post img, .modal.dark .post video, .modal.dark .post .embed {
    background: #000;
    border-radius: calc(16px - min(var(--pop-frame-pad, 0px), 8px) - 1px);
  }
  .modal.dark .post .ph-media { background: #1c1c1c !important; border-radius: 12px; }
  .modal.dark .post figcaption { margin: 0; padding: 10px 14px; color: #8a8a8a; }
  .modal.dark .modal-foot { padding: var(--pop-block-gap) 32px 0; }
  .modal.dark .modal-cta {
    display: block; width: 100%; margin-top: 0;
    padding: 16px 20px; border-radius: 14px;
    background: var(--pop-btn-bg, #262626); color: var(--pop-btn-text, #ffffff);
    font-size: 15px; font-weight: 500; text-align: center;
    transition: filter .2s;
  }
  .modal.dark .modal-cta:hover { opacity: 1; filter: brightness(1.25); }
  .modal-head { padding: var(--pop-top) 64px 0; text-align: var(--pop-align, center); }
  .modal-title {
    display: flex; align-items: center; justify-content: var(--pop-justify, center); gap: 10px;
  }
  .modal-title svg { width: 28px; height: 28px; flex: none; }
  .modal-desc { margin-top: var(--pop-title-gap); line-height: var(--pop-desc-line); color: var(--text-sub); }
  /* 기여도 · 날짜 (적은 항목만 표시) */
  .modal-meta {
    display: flex; flex-wrap: wrap; gap: 8px 28px;
    justify-content: var(--pop-justify, center);
    margin-top: 18px;
  }
  .modal-meta:empty { display: none; }
  .modal-meta div { display: flex; gap: 10px; align-items: baseline; }
  .modal-meta dt { opacity: .55; font-weight: 500; }
  .modal-meta dd { margin: 0; }

  /* 게시물: 이미지/영상/텍스트를 세로로 이어 붙임 */
  .post { padding: var(--pop-content-gap) 32px 0; display: flex; flex-direction: column; gap: var(--pop-block-gap); }
  .post .text { max-width: 760px; margin: 0 auto; text-align: var(--pop-align, center); }
  .modal.align-left .post .text, .modal.align-left .post figcaption { margin-left: 0; text-align: left; }
  .post figure { margin: 0; }
  .post img, .post video, .post .ph-media, .post .embed {
    display: block; width: 100%; border-radius: 10px; background: #f2f2f6;
  }
  .post img, .post video { height: auto; }
  .post .ph-media { aspect-ratio: 16 / 9; display: grid; place-items: center; color: #fff; font-size: 14px; letter-spacing: .1em; }
  .post .embed { aspect-ratio: 16 / 9; border: 0; }
  .post figcaption { text-align: center; margin-top: 8px; font-size: 12px; color: var(--text-sub); }
  .post .text { line-height: var(--pop-text-line); color: #7a6b74; white-space: pre-line; padding: 4px 2px; }
  .modal-cta {
    display: inline-block; margin-top: 12px;
    padding: 12px 22px; border-radius: 999px;
    background: var(--pink); color: #fff; text-decoration: none;
    font-size: 14px; font-weight: 500;
    transition: opacity .2s;
  }
  .modal-cta:hover { opacity: .85; }
  .modal-foot { padding: var(--pop-block-gap) 28px 0; text-align: center; }
  .modal-scroll { padding-bottom: var(--pop-bottom); }
  /* 마우스로 잡아 끄는 중 */
  html.grabbing, html.grabbing * { cursor: grabbing !important; user-select: none; }
  /* 이미지·영상 저장 막기: 끌어서 저장, 길게 눌러 저장(아이폰), 선택 방지 */
  img, video {
    -webkit-user-drag: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  /* 닫기(X) 버튼: 버튼 크기·X 크기는 편집기 > 팝업 에서 조절 */
  .modal-close {
    position: absolute; top: 16px; right: 18px; z-index: 2;
    width: var(--close-size, 40px); height: var(--close-size, 40px); border-radius: 50%;
    border: 0; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: var(--close-bg); color: var(--close-color);
    font-size: var(--close-x, 24px); line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
  }

  /* ---------- Mobile ---------- */
  /* ---------- 처음 접속할 때 위에서부터 차례로 페이드인 ---------- */
  .reveal { opacity: 0; animation: reveal .8s cubic-bezier(.2, .7, .2, 1) var(--reveal-delay, 0s) forwards; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- 따라오는 커서 (편집기 > 커서 > 따라오는 커서) ---------- */
  html.trail-on, html.trail-on * { cursor: none !important; }
  .tc-dot, .tc-ring {
    position: fixed; left: 0; top: 0; z-index: 2147483000;
    pointer-events: none; opacity: 0;
    border-radius: var(--tc-radius, 0px);
    mix-blend-mode: var(--tc-blend, difference);   /* 밝은 곳에서도 보이도록 색 반전 */
    will-change: transform;
  }
  html.tc-visible .tc-dot, html.tc-visible .tc-ring { opacity: 1; }
  .tc-dot {
    width: var(--tc-dot, 5px); height: var(--tc-dot, 5px);
    background: var(--tc-color, #fff);
  }
  .tc-ring {
    width: var(--tc-ring, 26px); height: var(--tc-ring, 26px);
    border: var(--tc-border, 1.5px) solid color-mix(in srgb, var(--tc-color, #fff) 60%, transparent);
    transition: width .18s, height .18s, background-color .18s, border-color .18s, scale .15s;
  }
  /* 카드·링크·버튼 위: 테두리가 커지고 살짝 채워짐 */
  .tc-ring.hover {
    width: var(--tc-ring-hover, 46px); height: var(--tc-ring-hover, 46px);
    background: color-mix(in srgb, var(--tc-color, #fff) 12%, transparent);
    border-color: var(--tc-color, #fff);
  }
  .tc-ring.down { scale: .82; }

  /* ---------- 진입 화면 ----------
     로고 → START → 픽셀 움짤 → 이미지 순서. 크기·색·간격은 편집기 > 진입 화면 에서 */
  html.intro-pending body > :not(.intro):not(.iris):not(.tc-dot):not(.tc-ring):not(.intro-sound) { visibility: hidden; }
  html.intro-pending, html.intro-pending body { overflow: hidden; }
  .intro {
    position: fixed; inset: 0; z-index: 100;
    background: var(--intro-bg, #2e2a35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 0;
    padding: 24px; overflow: hidden;
  }
  .intro[hidden] { display: none; }
  /* 사라질 때 (Windows 애니메이션 설정과 상관없이 재생되도록 animation 사용) */
  .intro.leaving { animation: intro-out .6s ease forwards; pointer-events: none; }
  @keyframes intro-out { to { opacity: 0; visibility: hidden; } }
  .intro img { display: block; height: auto; max-width: 86vw; image-rendering: pixelated; }
  .intro-logo-wrap { position: relative; }
  /* 진입 화면 텍스트 (글꼴·크기·자간·줄 간격·색은 항목마다) */
  .intro-text {
    max-width: 90vw; text-align: center; white-space: pre-line;
    font-size: var(--fs, 20px); color: #ffffff;
  }

  /* 진입 화면 배경음악 조절 (음소거 버튼 + 볼륨) */
  .intro-sound {
    position: fixed; z-index: 102; right: 20px; bottom: 20px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 999px;
    background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14);
    color: var(--snd-color, #ffffff);
    transition: opacity .4s;
  }
  .intro-sound.top { top: 20px; bottom: auto; }
  .intro-sound.left { left: 20px; right: auto; }
  .intro-sound.leaving { opacity: 0; pointer-events: none; }
  .intro-sound button {
    border: 0; background: none; color: inherit; cursor: pointer;
    width: 26px; height: 26px; padding: 0; display: grid; place-items: center;
  }
  .intro-sound svg { width: 22px; height: 22px; }

const PALETTE = [["#c9d8ff","#ffd1e1"],["#ffe0ea","#cfe0ff"],["#d9d2ff","#ffd8e8"],["#cfd3e6","#f7c6d9"],

function normalize(b) {

  if (b.type) return b;

   카드 양옆 빈 공간에 좌우 번갈아 배치. 같은 설정이면 매번 같은 배치(번호로 섞음) */

  const imgs = c && c.enabled ? (c.images || []).filter(Boolean) : [];
  const docH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
  const vw = document.documentElement.clientWidth;
  const key = JSON.stringify([c, docH, vw]);
  if (key === stickerState.key) return;             // 바뀐 게 없으면 다시 배치하지 않음
  stickerState.key = key;
  if (stickerState.observer) stickerState.observer.disconnect();
  box.innerHTML = frontBox.innerHTML = "";
  if (!imgs.length) { box.style.height = frontBox.style.height = "0px"; return; }

  const layer = c.layer || "auto";
  const cardsTop = document.getElementById("links").getBoundingClientRect().top + window.scrollY;

  const rand = seededRandom(c.seed || 1);
  const small = vw < 560;
  const base = Math.max(30, Number(c.size) || 110) * (small ? .6 : 1);
  const vary = Math.max(0, Math.min(.9, Number(c.sizeVary ?? .35)));
  const rot = Math.max(0, Math.min(90, Number(c.rotate ?? 22)));
  const gapY = 900 / Math.max(1, Math.min(20, Number(c.density) || 5));   // 밀도: 화면 높이 900px 당 개수

      ? rand() * Math.max(0, left - size + overlap)
      : right - overlap + rand() * Math.max(0, vw - right - size + overlap);

    img.draggable = false;
    Object.assign(img.style, { left: x + "px", top: y + (rand() - .5) * gapY * .5 + "px", width: size + "px" });
    img.style.setProperty("--r", ((rand() * 2 - 1) * rot).toFixed(1) + "deg");
    const top = parseFloat(img.style.top);
    const onTop = layer === "front" || (layer === "auto" && top + size / 2 < cardsTop);
    (onTop ? frontBox : box).appendChild(img);
    y += gapY * (.7 + rand() * .6);
    k++;
  }

  /* 위에서부터 순서대로 (같은 높이면 왼쪽부터) */
  stickerState.list = [...box.querySelectorAll(".sticker"), ...frontBox.querySelectorAll(".sticker")]
    .sort((a, b) => parseFloat(a.style.top) - parseFloat(b.style.top) || parseFloat(a.style.left) - parseFloat(b.style.left));
  stickerState.queue = new Set();
  stickerState.gap = Math.max(40, Math.min(1500, Number(c.interval ?? 220)));
  clearInterval(stickerState.pump); stickerState.pump = 0;
  /* 화면에 들어오면 착! 단, 방문자가 스크롤을 처음 움직이기 전까지는 아무것도 붙지 않음.
     한꺼번에 붙지 않고 줄을 세워서 한 장씩 → 아래 것이 먼저 보이면 그 위에 아직 안 붙은 것부터 차례로 */
  stickerState.observer = new IntersectionObserver(entries => entries.forEach(en => {
    if (!en.isIntersecting) return;
    const idx = stickerState.list.indexOf(en.target);
    stickerState.list.slice(0, idx + 1).forEach(s => {
      if (!s.classList.contains("stuck") && !s.classList.contains("instant")) stickerState.queue.add(s);
      stickerState.observer.unobserve(s);
    });
    pumpStickers();
  }), { threshold: .35 });
  if (stickerState.scrolled) watchStickers();
}
/* 줄 선 스티커를 맨 위 것부터 일정 간격으로 하나씩 붙임 */
function pumpStickers() {
  if (stickerState.pump || !stickerState.queue.size) return;
  const next = () => {
    const first = stickerState.list.find(s => stickerState.queue.has(s));
    if (!first) { clearInterval(stickerState.pump); stickerState.pump = 0; return; }
    stickerState.queue.delete(first);
    first.classList.add("stuck");
  };
  next();
  stickerState.pump = setInterval(next, stickerState.gap);
}
/* 스크롤이 시작된 뒤: 지나온 위치는 바로 붙은 상태로, 나머지는 화면에 들어올 때 착! */
function watchStickers() {
  document.querySelectorAll(".stickers .sticker:not(.stuck):not(.instant)").forEach(s => {
    if (parseFloat(s.style.top) + 40 < window.scrollY) s.classList.add("instant");
    else stickerState.observer && stickerState.observer.observe(s);
  });
}
stickerState.scrolled = false;
window.addEventListener("scroll", function firstScroll() {
  window.removeEventListener("scroll", firstScroll);
  stickerState.scrolled = true;
  watchStickers();
}, { passive: true });
/* 창 크기가 바뀌거나 이미지가 늦게 로드돼서 페이지 길이가 바뀌면 다시 배치 */
window.addEventListener("resize", () => scheduleStickers(stickerState.cfg));
window.addEventListener("load", () => scheduleStickers(stickerState.cfg));
new ResizeObserver(() => scheduleStickers(stickerState.cfg)).observe(document.body);

/* ---------- 클릭하면 픽셀 별이 팡! (편집기 > 커서 > 클릭 효과) ---------- */
const PIXEL_STARS = [
  ["..#..", ".###.", "#####", ".###.", ".#.#."],      // 별
  ["..#..", "..#..", "##.##", "..#..", "..#.."],      // 반짝이
  [".#.", "###", ".#."],                               // 작은 십자
];
const pixelStarSVG = (shape, color) => {
  const w = shape[0].length, hgt = shape.length;
  const rects = shape.flatMap((row, y) => [...row].map((ch, x) => ch === "#" ? `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>` : "")).join("");
  return `<svg viewBox="0 0 ${w} ${hgt}" fill="${color}" shape-rendering="crispEdges" style="width:100%;height:100%;display:block">${rects}</svg>`;
};
const clickFx = { cfg: null, live: 0 };
document.addEventListener("pointerdown", e => {
  const c = clickFx.cfg;
  if (!c || !c.enabled || e.button > 0 || clickFx.live > 120) return;   // 너무 많이 쌓이지 않게
  const okColor = v => /^#[0-9a-f]{3,8}$/i.test(v || "");
  const colors = [c.c1 ?? "#ffffff", c.c2 ?? "#ec8fb0", c.c3 ?? "#ffe066"].filter(okColor);
  const count = Math.max(1, Math.min(30, Number(c.count) || 8));
  const size = Math.max(4, Math.min(60, Number(c.size) || 12));
  const dist = Math.max(10, Math.min(300, Number(c.distance) || 60));
  const shapes = c.shape === "star" ? [PIXEL_STARS[0]] : c.shape === "sparkle" ? [PIXEL_STARS[1], PIXEL_STARS[2]] : PIXEL_STARS;
  for (let k = 0; k < count; k++) {
    const el = document.createElement("div");
    const s = size * (.6 + Math.random() * .7);
    Object.assign(el.style, {
      position: "fixed", left: e.clientX - s / 2 + "px", top: e.clientY - s / 2 + "px",
      width: s + "px", height: s + "px", pointerEvents: "none", zIndex: 2147482999
    });
    /* 바깥(el)은 이동만, 안쪽(inner)은 크기·회전·투명도만 → 두 움직임이 동시에 자연스럽게 흘러감 */
    el.innerHTML = `<div style="width:100%;height:100%">${pixelStarSVG(shapes[k % shapes.length], colors[k % colors.length] || "#fff")}</div>`;
    const inner = el.firstElementChild;
    document.body.appendChild(el);
    clickFx.live++;
    /* 고르게 퍼지되 살짝 랜덤하게 */
    const ang = (k / count) * Math.PI * 2 + (Math.random() - .5) * .6;
    const d = dist * (.6 + Math.random() * .6);
    const dx = Math.cos(ang) * d, dy = Math.sin(ang) * d;
    /* 속도: 1 = 보통, 2 = 두 배 빠르게, 0.5 = 두 배 느리게 */
    const speed = Math.max(.3, Math.min(3, Number(c.speed) || 1));
    const dur = (720 + Math.random() * 200) / speed;
    /* 이동: 처음엔 빠르게 튀어나가고 점점 느려지되 멈추지 않음 (+ 살짝 아래로 떨어짐) */
    const move = el.animate([
      { transform: "translate(0,0)" },
      { transform: `translate(${dx}px,${dy + dist * .25}px)` }
    ], { duration: dur, easing: "cubic-bezier(.25,.5,.45,.95)" });
    /* 모양: 톡 커졌다가 날아가는 내내 서서히 작아지고 옅어짐 */
    const spin = (Math.random() - .5) * 160;
    inner.animate([
      { transform: "scale(.4) rotate(0deg)", opacity: 1 },
      { transform: `scale(1.1) rotate(${spin * .25}deg)`, opacity: 1, offset: .15 },
      { transform: `scale(.25) rotate(${spin}deg)`, opacity: 0 }
    ], { duration: dur, easing: "linear" });
    const done = () => { el.remove(); clickFx.live--; };
    move.onfinish = done;
    setTimeout(() => { if (el.isConnected) done(); }, dur + 600);   // 혹시 애니메이션이 멈춰도 치우기
  }
}, { passive: true, capture: true });

/* ---------- 따라오는 커서 ----------
   작은 점은 마우스를 바로 따라오고, 테두리는 살짝 늦게 미끄러지듯 따라옴.
   카드·링크·버튼 위에서는 테두리가 커짐. 마우스가 있는 기기(PC)에서만 켜짐 */
const trail = { on: false, dot: null, ring: null, x: -100, y: -100, rx: -100, ry: -100, ease: .15, raf: 0, bound: false };
const TRAIL_HOVER = "a, button, summary, label, input, textarea, .card-link, .modal-close, [role=button]";
function trailCursor(t) {
  const usable = t && matchMedia("(hover: hover) and (pointer: fine)").matches;
  document.documentElement.classList.toggle("trail-on", !!usable);
  if (!usable) {
    trail.on = false;
    trail.dot && trail.dot.remove(); trail.ring && trail.ring.remove();
    trail.dot = trail.ring = null;
    cancelAnimationFrame(trail.raf);
    return;
  }
  if (!trail.dot) {
    trail.dot = document.createElement("div"); trail.dot.className = "tc-dot";
    trail.ring = document.createElement("div"); trail.ring.className = "tc-ring";
    document.body.append(trail.ring, trail.dot);
  }
  const root = document.documentElement.style;
  const px = (k, v) => v != null && !isNaN(v) ? root.setProperty(k, Number(v) + "px") : root.removeProperty(k);
  root.setProperty("--tc-color", /^#[0-9a-f]{3,8}$/i.test(t.color || "") ? t.color : "#ffffff");
  root.setProperty("--tc-radius", t.shape === "circle" ? "50%" : "0px");
  root.setProperty("--tc-blend", t.blend === false ? "normal" : "difference");
  px("--tc-dot", t.dot); px("--tc-ring", t.ring); px("--tc-ring-hover", t.ringHover); px("--tc-border", t.border);
  trail.ease = Math.max(.04, Math.min(1, Number(t.ease) || .15));
  trail.on = true;
  if (!trail.bound) {
    trail.bound = true;
    document.addEventListener("mousemove", e => {
      if (!trail.on) return;
      trail.x = e.clientX; trail.y = e.clientY;
      if (trail.rx < -50) { trail.rx = trail.x; trail.ry = trail.y; }   // 처음엔 바로 그 자리에서 시작
      trail.dot.style.transform = `translate3d(${trail.x}px, ${trail.y}px, 0) translate(-50%, -50%)`;
      document.documentElement.classList.add("tc-visible");
      if (!trail.raf) trail.raf = requestAnimationFrame(trailLoop);
    }, { passive: true });
    document.addEventListener("mouseover", e => {
      if (trail.on) trail.ring.classList.toggle("hover", !!e.target.closest(TRAIL_HOVER));
    }, { passive: true });
    document.addEventListener("mousedown", () => trail.on && trail.ring.classList.add("down"));
    document.addEventListener("mouseup", () => trail.on && trail.ring.classList.remove("down"));
    document.documentElement.addEventListener("mouseleave", () => document.documentElement.classList.remove("tc-visible"));
  }
}
function trailLoop() {
  trail.rx += (trail.x - trail.rx) * trail.ease;
  trail.ry += (trail.y - trail.ry) * trail.ease;
  if (trail.ring) trail.ring.style.transform = `translate3d(${trail.rx}px, ${trail.ry}px, 0) translate(-50%, -50%)`;
  const still = Math.abs(trail.x - trail.rx) < .1 && Math.abs(trail.y - trail.ry) < .1;
  trail.raf = trail.on && !still ? requestAnimationFrame(trailLoop) : 0;
}

/* ---------- 마우스 커서 (편집기 > 커서) ----------
   올린 이미지를 지정한 크기로 줄여서 커서로 사용. 휴대폰·태블릿에는 커서가 없어서 영향 없음 */
let cursorKey = null;
function applyCursor(c) {
  const key = JSON.stringify(c || {});
  if (key === cursorKey) return;            // 바뀐 게 없으면 다시 만들지 않음
  cursorKey = key;
  let el = document.getElementById("cursor-style");
  /* 종류: none(기본 마우스) / image(내 이미지) / trail(따라오는 커서) */
  const mode = c ? (c.mode || (c.normal ? "image" : "none")) : "none";
  trailCursor(mode === "trail" ? (c.trail || {}) : null);
  if (mode !== "image" || !c.normal) { if (el) el.textContent = ""; return; }
  const size = Math.max(16, Math.min(128, Number(c.size) || 32));
  const hot = c.hotspot === "center" ? [size / 2, size / 2] : [0, 0];
  /* 이미지를 커서 크기로 줄인 PNG 로 만들기 */
  const shrink = src => new Promise(resolve => {
    if (!src) return resolve(null);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(size / img.naturalWidth, size / img.naturalHeight);
      const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      try { resolve(cv.toDataURL("image/png")); } catch { resolve(null); }
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
  Promise.all([shrink(c.normal), shrink(c.pointer)]).then(([n, ptr]) => {
    if (key !== cursorKey || !n) return;
    if (!el) { el = document.createElement("style"); el.id = "cursor-style"; document.head.appendChild(el); }
    const at = `${Math.round(hot[0])} ${Math.round(hot[1])}`;
    el.textContent =
      `html, body, body * { cursor: url("${n}") ${at}, auto; }` +
      `a, a *, button, button *, summary, label, .card-link, .modal-close, input[type=range], [role=button] ` +
      `{ cursor: url("${ptr || n}") ${at}, pointer; }`;
  });
}

/* ---------- render page ---------- */
let SITE_DATA = window.SITE || { profile: {}, links: [] };

function render(site) {
  SITE_DATA = site;
  const p = site.profile || {};

  /* 글자 크기 · 굵기 · 자간 */
  let styleEl = document.getElementById("text-styles");
  if (!styleEl) {
    styleEl = document.createElement("style");
    styleEl.id = "text-styles";
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = textStyleCSS(site.theme || {});

  /* 팝업 스타일 */
  const pop = (site.theme || {}).popup || {};
  const rootStyle = document.documentElement.style;
  const okColor = c => /^#[0-9a-f]{3,8}$/i.test(c || "");
  [["--close-color", pop.closeColor], ["--close-bg", pop.closeBg], ["--close-bg-custom", pop.closeBg], ["--scroll-color", pop.scrollColor]]
    .forEach(([k, v]) => okColor(v) ? rootStyle.setProperty(k, v) : rootStyle.removeProperty(k));
  const POP_VARS = { closeSize: ["--close-size", "px"], closeX: ["--close-x", "px"], width: ["--modal-width", "px"], gap: ["--modal-gap", "px"], top: ["--pop-top", "px"], titleGap: ["--pop-title-gap", "px"],
    contentGap: ["--pop-content-gap", "px"], blockGap: ["--pop-block-gap", "px"], bottom: ["--pop-bottom", "px"],
    descLine: ["--pop-desc-line", ""], textLine: ["--pop-text-line", ""] };
  for (const [key, [cssVar, unit]] of Object.entries(POP_VARS))
    pop[key] != null && !isNaN(pop[key]) ? rootStyle.setProperty(cssVar, Number(pop[key]) + unit) : rootStyle.removeProperty(cssVar);

  /* 팝업 스타일: 다크(기본) / 라이트, 정렬, 색 */
  const modalEl = document.getElementById("modal");
  const dark = pop.style !== "light";
  modalEl.classList.toggle("dark", dark);
  modalEl.classList.toggle("align-left", pop.align === "left");
  rootStyle.setProperty("--pop-align", pop.align === "left" ? "left" : "center");
  rootStyle.setProperty("--pop-justify", pop.align === "left" ? "flex-start" : "center");
  [["--pop-bg", dark ? pop.bg : null], ["--pop-btn-bg", pop.btnBg], ["--pop-btn-text", pop.btnText]]
    .forEach(([k, v]) => okColor(v) ? rootStyle.setProperty(k, v) : rootStyle.removeProperty(k));
  pop.framePad != null ? rootStyle.setProperty("--pop-frame-pad", Number(pop.framePad) + "px") : rootStyle.removeProperty("--pop-frame-pad");

  applyCursor((site.theme || {}).cursor);
  scheduleStickers(site.stickers);
  clickFx.cfg = (site.theme || {}).clickFx || null;

  const hero = document.getElementById("hero");
  const isVideo = /\.(mp4|webm|mov|m4v)(\?|$)/i.test(p.header || "");
  const heroSrc = hero.firstElementChild?.getAttribute("src");
  if (!p.header) hero.innerHTML = "";
  else if (heroSrc !== p.header)   /* 같은 파일이면 다시 그리지 않음 (미리보기 깜빡임 방지) */
    hero.innerHTML = isVideo
      ? `<video src="${esc(p.header)}" autoplay loop muted playsinline disablepictureinpicture></video>`
      : `<img src="${esc(p.header)}" alt="" draggable="false">`;
  document.getElementById("logo").textContent = p.logo || "";
  /* 프로필 사진이 없으면 동그라미 자체를 숨김 */
  const avatar = document.getElementById("avatar");
  avatar.innerHTML = p.avatar ? `<img src="${esc(p.avatar)}" alt="${esc(p.name)}">` : "";
  avatar.style.display = p.avatar ? "" : "none";
  document.getElementById("name").style.marginTop = p.avatar ? "" : "28px";
  document.getElementById("name").textContent = p.name || "";
  document.getElementById("kana").textContent = p.kana || "";
  document.getElementById("bio").textContent = p.bio || "";

  const socials = document.getElementById("socials");
  socials.innerHTML = "";
  SOCIAL_ORDER.forEach(key => {
    const url = (p.socials || {})[key];
    if (!url) return;
    const a = document.createElement("a");
    a.href = key === "email" && !/^mailto:/.test(url) ? "mailto:" + url : url;
    a.target = "_blank"; a.rel = "noopener";
    a.setAttribute("aria-label", SOCIAL_LABELS[key]);
    a.innerHTML = SOCIAL_ICONS[key];
    socials.appendChild(a);
  });
  socials.style.display = socials.children.length ? "" : "none";

  const list = document.getElementById("links");
  list.innerHTML = "";
  (site.links || []).forEach((l, i) => {
    const li = document.createElement("li");
    /* 카테고리 구분선 */
    if (l.type === "category") {
      li.className = "category";
      li.setAttribute("role", "presentation");
      li.innerHTML = `<span>${esc(l.title)}</span>`;
      list.appendChild(li);
      return;
    }
    li.className = "card";
    li.dataset.index = i;
    /* 게시글이 있으면 카드를 눌렀을 때 팝업, 없으면 링크 주소로 바로 이동 */
    const hasPost = (l.post || []).length > 0;
    const goUrl = l.url && l.url !== "#";
    const inner = `
      <span class="card-content">
        <span class="card-text">
          <span class="card-title" style="display:block">${esc(l.title)}</span>
          <span class="card-sub" style="display:block">${esc(l.sub)}</span>
        </span>
      </span>`;
    li.innerHTML = `<div class="card-bg"></div>
      <div class="card-layer card-base">${inner}</div>
      <div class="card-layer card-fill" aria-hidden="true">${inner}</div>` + (hasPost || !goUrl
      ? `<button class="card-link" type="button" aria-label="${esc(l.title)} 작업물 보기"></button>`
      : `<a class="card-link" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="${esc(l.title)}"></a>`);
    li.querySelector(".card-bg").style.backgroundImage = bg(l.thumb, i, 0);
    const isColor = c => /^#[0-9a-f]{3,8}$/i.test(c || "");
    if (isColor(l.hoverColor)) li.style.setProperty("--hover-fill", l.hoverColor);
    if (isColor(l.hoverText)) li.style.setProperty("--hover-text", l.hoverText);
    if (l.hoverOpacity != null) li.style.setProperty("--hover-alpha", Math.max(0, Math.min(100, Number(l.hoverOpacity))) + "%");
    const pct = v => Math.max(0, Math.min(100, Number(v))) + "%";
    if (l.hoverFadeStart != null) li.style.setProperty("--fade-start", pct(l.hoverFadeStart));
    if (l.hoverFadeEnd != null) li.style.setProperty("--fade-end", pct(l.hoverFadeEnd));
    if (hasPost || !goUrl) li.querySelector(".card-link").addEventListener("click", e => openModal(i, e.currentTarget));
    list.appendChild(li);
  });
}

/* ---------- modal ---------- */
const modal = document.getElementById("modal");
const post = document.getElementById("post");
let lastFocus = null;

function openModal(i, trigger) {
  const l = SITE_DATA.links[i];
  if (!l || l.type === "category") return;
  lastFocus = trigger || null;
  document.getElementById("modal-title").textContent = l.title || "";
  document.getElementById("modal-desc").textContent = l.desc || l.sub || "";
  /* 기여도 · 날짜: 적은 것만 */
  const meta = document.getElementById("modal-meta");
  meta.innerHTML = [["기여도", l.contribution], ["날짜", l.date]]
    .filter(([, v]) => v && String(v).trim())
    .map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("");
  const cta = document.getElementById("modal-cta");
  cta.href = l.url || "#";
  cta.parentElement.style.display = l.url && l.url !== "#" ? "" : "none";

  post.innerHTML = "";
  (l.post || []).forEach((b, j) => post.appendChild(renderBlock(b, i, j + 1)));
  post.querySelectorAll("iframe.embed").forEach(watchYouTube);   // 유튜브 재생 중엔 배경음악 끄기

  modal.classList.add("open");
  document.body.classList.add("modal-open");
  if (trigger) {
    document.getElementById("modal-scroll").scrollTop = 0;
    document.getElementById("modal-close").focus();
    /* 방문 통계: 어떤 작업물을 열어봤는지 기록 */
    if (window.goatcounter && window.goatcounter.count)
      window.goatcounter.count({ path: "작업물/" + (l.title || i), title: l.title || "", event: true });
  }
}

function closeModal() {
  modal.classList.remove("open");
  document.body.classList.remove("modal-open");
  post.querySelectorAll("video").forEach(v => v.pause());
  setTimeout(() => { if (!modal.classList.contains("open")) post.innerHTML = ""; forgetGoneMedia(); }, 300);
  if (lastFocus) lastFocus.focus();
}

document.getElementById("modal-close").addEventListener("click", closeModal);

/* ---------- 부드러운 스크롤 (아이폰 느낌) — 메인 페이지와 팝업에 공통 적용 ----------
   - 마우스 휠: 한 칸씩 점프하지 않고 목표 위치까지 미끄러지듯 감속
   - 마우스로 잡아서 끌기 + 놓으면 관성으로 이어서 미끄러짐
   - 터치(휴대폰)는 기기 기본 관성 스크롤을 그대로 사용 */
const SMOOTH_EASE = 0.12;     // 클수록 빨리 멈춤 (0.08~0.2)
const SMOOTH_FLING = 380;     // 던졌을 때 더 미끄러지는 정도

/* scroller: 실제로 스크롤되는 요소, host: 이벤트를 받을 곳,
   active(): 지금 이 스크롤을 움직여도 되는지, noDrag: 끌기를 시작하지 않을 요소 */
function smoothScroll({ scroller, host, active = () => true, noDrag }) {
  const el = scroller;
  let current = 0, target = 0, lastSet = 0, raf = 0;

  const maxScroll = () => el.scrollHeight - el.clientHeight;
  const clamp = v => Math.max(0, Math.min(maxScroll(), v));
  const setTop = v => { lastSet = Math.round(v); el.scrollTop = v; };

  function loop() {
    target = clamp(target);
    current += (target - current) * SMOOTH_EASE;
    if (Math.abs(target - current) < 0.4) current = target;
    setTop(current);
    raf = current === target ? 0 : requestAnimationFrame(loop);
  }
  const run = () => { if (!raf) raf = requestAnimationFrame(loop); };
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };

  /* 스크롤바를 직접 끌거나 키보드·코드로 위치가 바뀌면 그 위치를 기준으로 다시 맞춤 */
  (host === window ? window : el).addEventListener("scroll", () => {
    if (Math.abs(el.scrollTop - lastSet) > 2) { stop(); current = target = lastSet = el.scrollTop; }
  });

  host.addEventListener("wheel", e => {
    if (e.ctrlKey || !active() || e.defaultPrevented) return;   // 확대/축소, 다른 스크롤 영역은 그대로
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? el.clientHeight : 1;
    if (!raf) current = target = el.scrollTop;
    target = clamp(target + e.deltaY * unit);
    run();
  }, { passive: false });

  /* 마우스로 잡아 끌기 */
  let drag = null, moved = false;
  host.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || e.button !== 0 || !active()) return;
    if (e.target.closest(noDrag)) return;
    if (host !== window && e.offsetX > el.clientWidth) return;   // 스크롤바 위
    if (host === window && e.clientX >= document.documentElement.clientWidth) return;
    stop();
    drag = { y: e.clientY, top: el.scrollTop, lastY: e.clientY, lastT: performance.now(), v: 0, id: e.pointerId };
    moved = false;
  });
  host.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dy = e.clientY - drag.y;
    if (!moved && Math.abs(dy) < 6) return;       // 살짝 움직인 건 클릭으로 취급
    if (!moved) {
      moved = true;
      document.documentElement.classList.add("grabbing");
      if (host !== window) el.setPointerCapture(e.pointerId);
    }
    const now = performance.now(), dt = Math.max(1, now - drag.lastT);
    drag.v = drag.v * 0.6 + ((e.clientY - drag.lastY) / dt) * 0.4;   // 속도 (px/ms) 평활화
    drag.lastY = e.clientY; drag.lastT = now;
    current = target = clamp(drag.top - dy);
    setTop(current);
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (moved) {
      document.documentElement.classList.remove("grabbing");
      /* 놓기 직전에 멈춰 있었으면 관성 없음 */
      const v = performance.now() - drag.lastT > 80 ? 0 : drag.v;
      target = clamp(el.scrollTop - v * SMOOTH_FLING);
      current = el.scrollTop;
      run();
    }
    drag = null;
  };
  host.addEventListener("pointerup", end);
  host.addEventListener("pointercancel", end);
  /* 끌고 난 뒤에는 클릭(카드 열기 등)으로 처리하지 않음 */
  host.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  /* 링크·이미지가 끌려 나가는 브라우저 기본 동작 막기 */
  host.addEventListener("dragstart", e => { if (drag) e.preventDefault(); });
}

/* 팝업 */
smoothScroll({
  scroller: document.getElementById("modal-scroll"),
  host: document.getElementById("modal-scroll"),
  noDrag: "a, button, video, iframe, input, textarea, figcaption, .text"
});
/* 메인 페이지 (팝업이 열려 있을 때는 멈춤) */
smoothScroll({
  scroller: document.scrollingElement || document.documentElement,
  host: window,
  active: () => !modal.classList.contains("open"),
  noDrag: "video, iframe, input, textarea, .modal"
});
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
});

render(SITE_DATA);

/* ---------- 진입 화면 ---------- */
const intro = document.getElementById("intro");
const INTRO_STARS = [[-6, -18], [96, 2], [-12, 72]];   // 로고 기준 별 위치 (%)

function buildIntro(c) {
  const px = v => v != null && !isNaN(v) ? Number(v) + "px" : null;
  const vars = { "--intro-bg": c.bg, "--intro-gap": px(c.gap), "--intro-logo-w": px(c.logoWidth),
    "--intro-gap-start": px(c.gapStart), "--intro-gap-gif": px(c.gapGif), "--intro-gap-img": px(c.gapImg),
    "--intro-start-hover": c.startHoverColor,
    "--intro-gif-w": px(c.gifWidth), "--intro-img-w": px(c.imageWidth), "--intro-start-size": px(c.startSize),
    "--intro-start-w": px(c.startWidth), "--intro-start-color": c.startColor,
    "--intro-star-color": c.starColor, "--intro-star-size": px(c.starSize) };
  Object.entries(vars).forEach(([k, v]) => v ? intro.style.setProperty(k, v) : intro.style.removeProperty(k));

  const starsHTML = INTRO_STARS.map(([x, y], k) =>
    `<span class="intro-star" style="left:${x}%;top:${y}%;animation-delay:${k * .7}s">★</span>`).join("");
  const startHTML = (gap, item = true) => `<button class="intro-start${item ? " intro-item" : ""}" type="button" aria-label="시작"${gap}>${
    c.startImage ? `<img src="${esc(c.startImage)}" alt="">` : esc(c.startText || "START")}</button>`;
  const gapAttr = it => it.gap != null && !isNaN(it.gap) ? ` style="--g:${Number(it.gap)}px"` : "";
  const parts = [];
  if (Array.isArray(c.items)) {
    /* 편집기에서 정한 순서대로: 이미지 여러 장 + START 하나 */
    c.items.forEach(it => {
      if (it.type === "start") return parts.push(startHTML(gapAttr(it)));
      if (it.type === "text") {
        if (!(it.text || "").trim()) return;
        const num = (v, d) => v != null && !isNaN(v) ? Number(v) : d;
        const pixel = it.font === "pixel";
        const css = [
          it.gap != null && !isNaN(it.gap) ? `--g:${Number(it.gap)}px` : "",
          `--fs:${num(it.size, pixel ? 16 : 20)}px`,
          `font-family:${pixel ? `'Press Start 2P', ui-monospace, monospace` : "var(--font)"}`,
          `font-weight:${pixel ? 400 : num(it.weight, 500)}`,
          `letter-spacing:${num(it.spacing, pixel ? .04 : 0)}em`,
          `line-height:${num(it.lineHeight, pixel ? 1.8 : 1.5)}`,
          /^#[0-9a-f]{3,8}$/i.test(it.color || "") ? `color:${it.color}` : ""
        ].filter(Boolean).join(";");
        return parts.push(`<div class="intro-text intro-item" style="${css}">${esc(it.text)}</div>`);
      }
      if (!it.src) return;
      const w = it.width != null && !isNaN(it.width) ? ` style="width:${Number(it.width)}px"` : "";
      parts.push(`<div class="intro-logo-wrap intro-item"${gapAttr(it)}><img src="${esc(it.src)}" alt=""${w}>${it.stars ? starsHTML : ""}</div>`);
    });
    if (!c.items.some(it => it.type === "start")) parts.push(startHTML(""));   // START 는 항상 있어야 들어갈 수 있음
  } else {
    /* 예전 형식 (로고·START·움짤·이미지 고정 칸) */
    if (c.logo) parts.push(`<div class="intro-logo-wrap"><img class="intro-logo" src="${esc(c.logo)}" alt="">${c.stars === false ? "" : starsHTML}</div>`);
    parts.push(startHTML("", false));
    if (c.gif) parts.push(`<img class="intro-gif" src="${esc(c.gif)}" alt="">`);
    if (c.image) parts.push(`<img class="intro-img" src="${esc(c.image)}" alt="">`);
  }
  intro.innerHTML = parts.join("");

  /* 글자 START 나 픽셀 글꼴 텍스트를 쓸 때만 픽셀 글꼴을 불러옴 */
  const needPixel = !c.startImage || (c.items || []).some(it => it.type === "text" && it.font === "pixel");
  if (needPixel && !document.getElementById("pixel-font")) {
    const link = document.createElement("link");
    link.id = "pixel-font"; link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap";
    document.head.appendChild(link);
  }
}

let introKeyHandler = null;
let introPreviewKey = null;
/* 기본 손: 흰색 픽셀아트 손바닥 (손가락 4개 + 엄지, 14×15 칸) */
const PIXEL_HAND = [
  "......##......",
  "...##.##.##...",
  "...##.##.##...",
  "...##.##.##.##",
  "...##.##.##.##",
  "##.##.##.##.##",
  "##.##.##.##.##",
  ".#############",
  ".#############",
  "..############",
  "..###########.",
  "...##########.",
  "...#########..",
  "....#######...",
  "....#######...",
];
const pixelHandSVG = () => {
  const w = PIXEL_HAND[0].length, hgt = PIXEL_HAND.length;
  const rects = PIXEL_HAND.flatMap((row, y) => [...row].map((ch, x) => ch === "#" ? `<rect x="${x}" y="${y}" width="1.02" height="1.02"/>` : "")).join("");
  return `<svg class="iris-hand" viewBox="0 0 ${w} ${hgt}" fill="#fff" aria-hidden="true">${rects}</svg>`;
};

/* START 를 누른 뒤
   ① 검정이 바깥에서 원 모양으로 조여 들어옴 (CLOSE_MS)
   ② 완전히 까매지면 손바닥이 떠서 흔들림 (waveMs)
   ③ 가운데에서 원이 커지며 홈페이지가 드러남 (OPEN_MS)
   onClosed: 완전히 까매졌을 때 / onOpen: 다시 열리기 시작할 때 */
const IRIS_CLOSE_MS = 800, IRIS_OPEN_MS = 900;
function playIris(c, { onClosed, onOpen } = {}) {
  const t = c.transition || {};
  const layer = document.createElement("div");
  layer.className = "iris closing";
  if (t.color) layer.style.setProperty("--iris-color", t.color);
  if (t.handSize) layer.style.setProperty("--hand-size", Number(t.handSize) + "px");
  if (t.textColor) layer.style.setProperty("--hand-text-color", t.textColor);
  const hand = t.hand ? `<img class="iris-hand" src="${esc(t.hand)}" alt="">` : pixelHandSVG();
  layer.innerHTML = `<div class="iris-hole"></div><div class="iris-inner">${hand}${t.text ? `<div class="iris-text">${esc(t.text)}</div>` : ""}</div>`;
  if (t.text && !document.getElementById("pixel-font")) {
    const link = document.createElement("link");
    link.id = "pixel-font"; link.rel = "stylesheet";
    link.href = "https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap";
    document.head.appendChild(link);
  }
  document.body.appendChild(layer);
  const waveMs = Math.max(300, Number(t.waveMs) || 1100);
  /* ① 조여 들어옴 → ② 손 인사 */
  setTimeout(() => {
    onClosed && onClosed();
    layer.classList.remove("closing");
    layer.classList.add("waving");
    /* ③ 가운데에서 열림 */
    setTimeout(() => {
      onOpen && onOpen();
      layer.classList.remove("waving");
      layer.classList.add("opening");
      setTimeout(() => layer.remove(), IRIS_OPEN_MS + 50);
    }, waveMs);
  }, IRIS_CLOSE_MS);
}

/* ---------- 배경음악 (진입 화면 · 메인 페이지 공통) ----------
   - 켜질 때 페이드인, 꺼질 때 페이드아웃 (시간은 편집기 > 음악 에서)
   - 브라우저 정책상 소리 있는 자동재생이 막히면 → 화면을 처음 클릭/터치할 때 재생 시작
   - 화면 구석에 음소거 버튼 + 볼륨 막대 (방문자가 정한 볼륨은 기억)
   - 영상·유튜브가 소리 내며 재생되는 동안은 자동으로 서서히 꺼졌다가, 멈추면 다시 켜짐 */
const SPEAKER_ON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`;
const SPEAKER_OFF = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="m16 9 5 6M21 9l-5 6"/></svg>`;

/* 볼륨을 ms 동안 to 까지 부드럽게 바꿈 */
function fadeVolume(audio, to, ms, done) {
  clearInterval(audio._fade);
  const from = audio.volume, t0 = performance.now();
  if (ms <= 0) { audio.volume = to; done && done(); return; }
  audio._fade = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    audio.volume = Math.max(0, Math.min(1, from + (to - from) * k));
    if (k >= 1) { clearInterval(audio._fade); done && done(); }
  }, 30);
}

/* 음악 하나 (m: 설정, key: 볼륨 기억용 이름, skipUnlock: 이 요소를 눌렀을 땐 재생 시작 안 함) */
function createBgm(m, key, skipUnlock) {
  const fadeMs = Math.max(0, Number(m.fade ?? 1.5)) * 1000;
  let target = Number(m.volume ?? .5);
  try { const saved = localStorage.getItem(key); if (saved !== null) target = Number(saved); } catch {}
  target = Math.max(0, Math.min(1, target));
  const audio = new Audio(m.src);
  audio.loop = m.loop !== false;
  audio.volume = 0;
  const bgm = { audio, ui: null, unlock: null, ducked: false, stopped: false };

  const ui = document.createElement("div");
  ui.className = "intro-sound" + (String(m.position || "").includes("top") ? " top" : "") + (String(m.position || "").includes("left") ? " left" : "");
  if (/^#[0-9a-f]{3,8}$/i.test(m.color || "")) ui.style.setProperty("--snd-color", m.color);
  ui.innerHTML = `<button type="button" class="snd-btn" aria-label="소리 켜기/끄기"></button>
    <input type="range" min="0" max="1" step="0.01" aria-label="볼륨" value="${target}">
    <span class="snd-hint"></span>`;
  document.body.appendChild(ui);
  bgm.ui = ui;
  const btn = ui.querySelector(".snd-btn"), range = ui.querySelector("input"), hint = ui.querySelector(".snd-hint");
  const paint = () => {
    const waiting = audio.paused && !bgm.ducked;
    btn.innerHTML = waiting || audio.muted || target === 0 ? SPEAKER_OFF : SPEAKER_ON;
    hint.textContent = waiting ? (m.hint || "소리 켜기") : "";
    hint.style.display = hint.textContent ? "" : "none";
  };
  /* 페이드인으로 재생 */
  bgm.play = () => {
    if (bgm.stopped) return;
    audio.volume = 0;
    return audio.play().then(() => { fadeVolume(audio, target, fadeMs); paint(); }).catch(paint);
  };
  btn.addEventListener("click", e => {
    e.stopPropagation();
    if (audio.paused && !bgm.ducked) { audio.muted = false; if (target === 0) target = .5, range.value = .5; bgm.play(); }
    else { audio.muted = !audio.muted; paint(); }
  });
  range.addEventListener("input", () => {
    target = Number(range.value);
    clearInterval(audio._fade);
    if (!bgm.ducked) audio.volume = target;
    audio.muted = false;
    try { localStorage.setItem(key, range.value); } catch {}
    if (audio.paused && !bgm.ducked && target > 0) bgm.play(); else paint();
  });
  ui.addEventListener("pointerdown", e => e.stopPropagation());

  /* 자동재생 시도 → 막히면 화면을 처음 누를 때 재생 */
  audio.volume = 0;
  audio.play().then(() => { fadeVolume(audio, target, fadeMs); paint(); }).catch(() => {
    paint();
    bgm.unlock = e => {
      if (e.target.closest && e.target.closest(".intro-sound")) return;
      if (skipUnlock && e.target.closest && e.target.closest(skipUnlock)) return;
      document.removeEventListener("pointerdown", bgm.unlock, true);
      bgm.unlock = null;
      if (audio.paused && !bgm.ducked) bgm.play();
    };
    document.addEventListener("pointerdown", bgm.unlock, true);
  });

  /* 페이드아웃으로 끄고 치우기 */
  bgm.stop = (fade = true) => {
    bgm.stopped = true;
    if (bgm.unlock) { document.removeEventListener("pointerdown", bgm.unlock, true); bgm.unlock = null; }
    ui.classList.add("leaving");
    setTimeout(() => ui.remove(), fade ? 450 : 0);
    if (!fade || audio.paused) { clearInterval(audio._fade); audio.pause(); return; }
    fadeVolume(audio, 0, fadeMs, () => audio.pause());
  };
  /* 영상 재생 중: 서서히 끄기 / 영상이 멈추면: 다시 서서히 켜기 */
  bgm.duck = on => {
    if (bgm.stopped || on === bgm.ducked) return;
    if (on) {
      bgm.wasPlaying = !audio.paused;
      bgm.ducked = true;
      if (bgm.wasPlaying) fadeVolume(audio, 0, Math.min(fadeMs, 800), () => { if (bgm.ducked) audio.pause(); });
    } else {
      bgm.ducked = false;
      if (bgm.wasPlaying) bgm.play();
    }
    paint();
  };
  paint();
  return bgm;
}

/* 진입 화면 음악 / 메인 음악 */
const introMusic = { bgm: null, get audio() { return this.bgm && this.bgm.audio; } };
const mainMusic = { bgm: null, get audio() { return this.bgm && this.bgm.audio; } };
function setupIntroMusic(m) {
  stopIntroMusic(false);
  if (m && m.src) introMusic.bgm = createBgm(m, "introVolume",
    /* 음악이 진입 화면 전용이면 START 를 누를 때 잠깐 울렸다 꺼지지 않게 */
    m.afterStart === "continue" && !(SITE_DATA.mainMusic || {}).src ? null : ".intro-start");
}
function stopIntroMusic(fade = true) {
  if (introMusic.bgm) introMusic.bgm.stop(fade);
  introMusic.bgm = null;
}
function startMainMusic(m) {
  if (mainMusic.bgm) mainMusic.bgm.stop(false);
  mainMusic.bgm = m && m.src ? createBgm(m, "mainVolume", null) : null;
  updateDuck();
}

/* ---------- 영상·유튜브가 소리 내며 재생되면 배경음악 자동으로 끄기 ---------- */
const loudMedia = new Set();
function updateDuck() {
  const on = loudMedia.size > 0 && (SITE_DATA.mainMusic || {}).autoMute !== false;
  [introMusic.bgm, mainMusic.bgm].forEach(b => b && b.duck(on));
}
/* <video>: 소리 있는 재생만 (반복 재생 움짤 영상은 무음이라 제외) */
const videoState = e => {
  const v = e.target;
  if (!(v instanceof HTMLVideoElement)) return;
  if (!v.paused && !v.ended && !v.muted && v.volume > 0) loudMedia.add(v); else loudMedia.delete(v);
  updateDuck();
};
["play", "playing", "pause", "ended", "volumechange", "emptied"].forEach(t => document.addEventListener(t, videoState, true));
/* 유튜브: 재생 상태를 알려달라고 요청하고, 알려주는 메시지로 판단 */
function watchYouTube(iframe) {
  const hello = () => {
    try {
      iframe.contentWindow.postMessage(JSON.stringify({ event: "listening", id: 1, channel: "widget" }), "*");
      iframe.contentWindow.postMessage(JSON.stringify({ event: "command", func: "addEventListener", args: ["onStateChange"] }), "*");
    } catch {}
  };
  iframe.addEventListener("load", () => { hello(); setTimeout(hello, 800); });
}
window.addEventListener("message", e => {
  if (!/(^|\.)youtube(-nocookie)?\.com$/.test((() => { try { return new URL(e.origin).hostname; } catch { return ""; } })())) return;
  let data; try { data = typeof e.data === "string" ? JSON.parse(e.data) : e.data; } catch { return; }
  const state = data && (data.event === "onStateChange" ? data.info : data.info && data.info.playerState);
  if (typeof state !== "number") return;
  const frame = [...document.querySelectorAll("iframe")].find(f => f.contentWindow === e.source);
  if (!frame) return;
  if (state === 1 || state === 3) loudMedia.add(frame); else loudMedia.delete(frame);   // 1 재생, 3 버퍼링
  updateDuck();
});
/* 팝업을 닫아서 영상·유튜브가 사라지면 정리 */
function forgetGoneMedia() {
  [...loudMedia].forEach(m => { if (!m.isConnected || (m instanceof HTMLVideoElement && m.paused)) loudMedia.delete(m); });
  updateDuck();
}

function showIntro(c, onStart) {
  buildIntro(c);
  intro.classList.remove("leaving");
  intro.hidden = false;
  setupIntroMusic(c.music);
  if (introKeyHandler) document.removeEventListener("keydown", introKeyHandler);
  const start = () => {
    document.removeEventListener("keydown", onKey);
    introKeyHandler = null;
    /* 음악: 기본은 START 와 함께 서서히 꺼짐 / '계속 재생' 이면 메인에서도 계속 (조절 버튼도 남음) */
    /* 메인 음악이 따로 있거나 '서서히 끄기' 면 페이드아웃, '계속 재생' 이면 그대로 */
    if (!(c.music && c.music.afterStart === "continue") || (SITE_DATA.mainMusic || {}).src) stopIntroMusic(true);
    else if (introMusic.bgm && introMusic.audio.paused) introMusic.bgm.play();
    if ((c.transition || {}).enabled === false) {
      /* 트랜지션을 끈 경우: 진입 화면이 서서히 사라짐 */
      intro.classList.add("leaving");
      setTimeout(() => { intro.hidden = true; intro.classList.remove("leaving"); }, 650);
      onStart && onStart();
      return;
    }
    playIris(c, {
      onClosed: () => { intro.hidden = true; },        // 완전히 까매지면 진입 화면 치우기
      onOpen: () => { onStart && onStart(); }          // 원이 열리기 시작할 때 홈페이지 등장
    });
  };
  const onKey = e => {
    if (e.target.closest && e.target.closest(".intro-sound")) return;   // 볼륨 조절 중에는 무시
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); }
  };
  intro.querySelector(".intro-start").addEventListener("click", start, { once: true });
  introKeyHandler = onKey;
  document.addEventListener("keydown", onKey);
  /* 자동 포커스는 하지 않음 (F5 등 키보드를 쓴 직후 호버 색이 저절로 켜지는 문제). Enter·스페이스는 위 onKey 로 동작 */
  if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
}

/* 처음 접속할 때: 헤더 → 프로필 정보 → 썸네일 카드 순서로 하나씩 페이드인 */
function revealOnLoad() {
  const visible = el => el && getComputedStyle(el).display !== "none" && (el.childElementCount || el.textContent.trim());
  const items = ["hero", "logo", "avatar", "name", "kana", "socials", "bio"]
    .map(id => document.getElementById(id)).filter(visible)
    .concat([...document.querySelectorAll("#links > li")]);
  let delay = 0.05;
  items.forEach((el, k) => {
    el.style.setProperty("--reveal-delay", delay.toFixed(2) + "s");
    el.classList.add("reveal");
    /* 헤더·정보는 0.12초, 카드는 0.09초 간격 (카드가 많아도 너무 오래 걸리지 않게) */
    delay += el.parentElement && el.parentElement.id === "links" ? 0.09 : 0.12;
    el.addEventListener("animationend", () => { el.classList.remove("reveal"); el.style.removeProperty("--reveal-delay"); }, { once: true });
  });
  /* 혹시 애니메이션이 실행되지 않는 환경이어도 내용이 숨겨진 채로 남지 않게 */
  setTimeout(() => items.forEach(el => el.classList.remove("reveal")), (delay + 1.5) * 1000);
}

/* 진입 화면을 보여줄지 정하고, START 를 누르면 메인 페이지 등장 */
(function startPage() {
  const c = SITE_DATA.intro || {};
  let seen = false;
  try { seen = sessionStorage.getItem("introSeen") === "1"; } catch {}
  const wanted = c.enabled && document.documentElement.classList.contains("intro-pending")
    && (c.frequency === "always" || !seen);
  const enter = () => {
    document.documentElement.classList.remove("intro-pending");
    revealOnLoad();
    /* 메인 페이지 음악 (편집기 미리보기 안에서는 자동으로 틀지 않음) */
    if (window.self === window.top) startMainMusic(SITE_DATA.mainMusic);
  };
  if (!wanted) return enter();
  showIntro(c, () => {
    try { sessionStorage.setItem("introSeen", "1"); } catch {}
    enter();
  });
})();

/* ---------- 방문 통계 (GoatCounter) ----------
   편집기 > 통계 에서 정한 코드로 기록. 내 컴퓨터(localhost)와 편집기 미리보기에서는 자동으로 기록하지 않음.
   내 휴대폰·PC 방문도 빼고 싶으면 그 기기에서 https://내도메인/#toggle-goatcounter 를 한 번 열기 */
(function analytics() {
  const code = ((SITE_DATA.analytics || {}).goatcounter || "").trim();
  if (!/^[a-z0-9-]+$/i.test(code)) return;
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.dataset.goatcounter = `https://${code}.goatcounter.com/count`;
  document.head.appendChild(s);
})();

/* 주소 끝에 #post-2 처럼 붙이면 해당 게시물이 바로 열립니다 */
const m = location.hash.match(/^#post-(\d+)$/);
if (m) openModal(+m[1]);

/* ---------- 이미지·영상 저장 막기 ----------
   오른쪽 클릭(PC) / 길게 누르기(휴대폰)의 '이미지 저장' 메뉴와 끌어서 저장을 막음.
   글자나 링크에서는 오른쪽 클릭이 그대로 됨 (이메일 복사 등) */
const PROTECTED = "img, video, .hero, .avatar, .card, .post figure";
document.addEventListener("contextmenu", e => {
  if (e.target.closest(PROTECTED)) e.preventDefault();
});
document.addEventListener("dragstart", e => {
  if (e.target.closest(PROTECTED)) e.preventDefault();
});

/* 편집기(admin.html) 실시간 미리보기용 */
let lastModalKey = null;
window.addEventListener("message", e => {
  if (e.origin !== location.origin || !e.data) return;
  /* 편집기의 "미리보기에서 호버 보기" 버튼 */
  /* 편집기의 "트랜지션 미리보기" 버튼 */
  if (e.data.type === "iris-demo") {
    playIris(e.data.intro || {}, { onClosed: () => { intro.hidden = true; } });
    return;
  }
  if (e.data.type === "hover-demo") {
    modal.classList.remove("open");
    document.body.classList.remove("modal-open");
    lastModalKey = null;
    const card = document.querySelector(`.card[data-index="${e.data.index}"]`);
    if (!card) return;
    card.scrollIntoView({ block: "center" });
    card.classList.add("demo");
    setTimeout(() => card.classList.remove("demo"), 1600);
    return;
  }
  if (e.data.type !== "site-preview") return;
  const { site, open, scrollTop, scrollBottom } = e.data;
  /* 편집기 '진입 화면' 메뉴에서는 진입 화면을 미리 보여줌 (START 를 누르면 닫힘, 내용을 바꾸면 다시 표시) */
  if (e.data.intro) {
    const key = JSON.stringify(site.intro || {});
    if (key !== introPreviewKey) { introPreviewKey = key; showIntro(site.intro || {}, null); }
  } else if (introPreviewKey !== null) {
    introPreviewKey = null;
    intro.hidden = true;
    stopIntroMusic(false);
  }
  const scroller = document.getElementById("modal-scroll");
  render(site);
  if (open == null || !site.links[open]) {
    lastModalKey = null;
    modal.classList.remove("open");
    document.body.classList.remove("modal-open");
    return;
  }
  /* 팝업 내용이 바뀌었을 때만 다시 그려서 깜빡임·영상 재로딩을 막음 */
  const key = open + JSON.stringify(site.links[open]);
  if (key !== lastModalKey) {
    const keep = scroller.scrollTop;
    openModal(open);
    scroller.scrollTop = scrollTop ? 0 : keep;
    lastModalKey = key;
  }
  if (scrollTop) scroller.scrollTop = 0;
  if (scrollBottom) setTimeout(() => scroller.scrollTo({ top: scroller.scrollHeight, behavior: "smooth" }), 100);
});
</script>
